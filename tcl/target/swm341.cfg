# Synwit SWM341 (Cortex-M33)

source [find target/swj-dp.tcl]

if { [info exists CHIPNAME] } {
	set _CHIPNAME $CHIPNAME
} else {
	set _CHIPNAME swm341
}

if { [info exists WORKAREASIZE] } {
	set _WORKAREASIZE $WORKAREASIZE
} else {
	set _WORKAREASIZE 0x4000
}

if { [info exists CPUTAPID] } {
	swj_newdap $_CHIPNAME cpu -expected-id $CPUTAPID
} else {
	swj_newdap $_CHIPNAME cpu
}

dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu
set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME cortex_m -dap $_CHIPNAME.dap -ap-num 0
$_TARGETNAME configure -work-area-phys 0x20000000 -work-area-size $_WORKAREASIZE

if { [info exists FLASH_SIZE] } {
	set _FLASH_SIZE $FLASH_SIZE
} else {
	set _FLASH_SIZE 0x00080000
}

if { [info exists SFC_SIZE] } {
	set _SFC_SIZE $SFC_SIZE
} else {
	set _SFC_SIZE 0x01000000
}

flash bank $_CHIPNAME.flash swm341 0x00000000 $_FLASH_SIZE 0 0 $_TARGETNAME
flash bank $_CHIPNAME.sfc   swm341sfc 0x70000000 $_SFC_SIZE 0 0 $_TARGETNAME

adapter speed 4000

if {![using_hla]} {
	cortex_m reset_config sysresetreq
}
